<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — DevNewSolutions</title>
    <meta name="description" content="Accede a tu panel de cliente de DevNewSolutions">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
</head>

<body class="login-page">
    <main class="container">
        <div class="login-card mx-auto">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a href="../index.html" class="text-decoration-none">
                            <span class="h4 fw-bold text-dark">DevNewSolutions</span>
                        </a>
                        <p class="text-muted mt-2 mb-0">Accede a tu panel de cliente</p>
                    </div>

                    <form id="login-form" action="#" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="tu@email.com" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label small" for="remember">Recordarme</label>
                            </div>
                            <a href="#" class="small text-primary">¿Olvidaste tu contraseña?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Iniciar sesión</button>
                        <div id="login-mensaje"></div>
                    </form>

                    <hr class="my-4">

                    <p class="text-center text-muted small mb-0">
                        ¿No tienes cuenta?
                        <a href="contact.html" class="text-primary">Contáctanos</a> para registrarte.
                    </p>
                </div>
            </div>

            <p class="text-center mt-3">
                <a href="../index.html" class="small text-muted">&larr; Volver al inicio</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
